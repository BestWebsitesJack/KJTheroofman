<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background for social media -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  
  <!-- Crimson circle -->
  <circle cx="500" cy="500" r="460" fill="#8b1a1a"/>
  <!-- Navy ring -->
  <circle cx="500" cy="500" r="460" stroke="#0c2340" stroke-width="44" fill="none"/>
  <!-- Gold outer ring -->
  <circle cx="500" cy="500" r="460" stroke="#bf8d2c" stroke-width="14" fill="none"/>

  <!-- Basketball seam arcs — dark shadow layer -->
  <path d="M 500 50 C 695 225 305 725 500 950" stroke="#0c2340" stroke-width="26" fill="none" opacity="0.55"/>
  <path d="M 50 500 C 225 305 725 695 950 500" stroke="#0c2340" stroke-width="26" fill="none" opacity="0.55"/>
  <!-- Basketball seam arcs — gold highlight layer -->
  <path d="M 500 50 C 695 225 305 725 500 950" stroke="#d4a843" stroke-width="14" fill="none"/>
  <path d="M 50 500 C 225 305 725 695 950 500" stroke="#d4a843" stroke-width="14" fill="none"/>

  <!-- KJ lettermark -->
  <text x="500" y="590" text-anchor="middle" dominant-baseline="middle"
    font-family="Oswald, Arial Black, sans-serif" font-weight="700" font-size="420"
    fill="white" letter-spacing="-14">KJ</text>

  <!-- Gold roof peak above KJ -->
  <path d="M 400 258 L 500 162 L 600 258" stroke="#d4a843" stroke-width="18" fill="none" stroke-linejoin="round"/>
  <line x1="400" y1="258" x2="600" y2="258" stroke="#d4a843" stroke-width="12"/>

  <!-- THE ROOFMAN arc text at bottom -->
  <path id="bottomArc" d="M 108 520 A 392 392 0 0 0 892 520" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="white" letter-spacing="14" opacity="0.9">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">THE ROOFMAN</textPath>
  </text>
</svg>
